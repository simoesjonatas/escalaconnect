{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'images/logo_connect.JPG' %}" type="image/jpeg">
    <title>Termo de Compromisso do Voluntário - Escala Connect</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        .termo-card { max-width: 760px; text-align: left; }
        .termo-card h1 { text-align: center; }
        .termo-texto {
            max-height: 45vh; overflow-y: auto;
            background: rgba(0, 0, 0, .18);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px; padding: 16px 18px; margin: 16px 0;
            line-height: 1.6; font-size: .95rem;
        }
        .termo-texto h3 { margin-top: 0; }
        .termo-texto ul { padding-left: 1.2rem; }
        .termo-texto li { margin-bottom: .5rem; }
        .termo-acoes { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .termo-acoes form { margin: 0; }
        .termo-sair { color: #9aa4ad; text-decoration: none; }
        .termo-sair:hover { color: #39ff14; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card termo-card">
            <div class="login-logo" aria-hidden="true">
                <img src="{% static 'images/logo_connect.JPG' %}" alt="Connect" />
            </div>
            <h1>Termo de Compromisso do Voluntário</h1>
            <p>Para participar das escalas, leia e aceite o termo abaixo.</p>

            <div class="termo-texto">
                {% include "usuario/_termo_texto.html" %}
            </div>

            <div class="termo-acoes">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit">Li e aceito o termo</button>
                </form>
                <a class="termo-sair" href="{% url 'logout' %}">Sair</a>
            </div>
        </div>
    </div>
</body>
</html>
