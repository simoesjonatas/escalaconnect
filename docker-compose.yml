services:
  web:
    container_name: escalaconnect
    hostname: escalaconnect
    restart: always
    build: .
    # Produção: migra, coleta estáticos e sobe o gunicorn (em entrypoint.sh,
    # para evitar o YAML quebrar os argumentos do gunicorn em várias linhas).
    command: sh /code/entrypoint.sh
    # Sem porta pública: quem expõe é o nginx. Continua acessível pelo nome 'web' na rede.
    expose:
      - "8000"
    volumes:
      # Compartilha os estáticos coletados com o nginx.
      - static_volume:/code/staticfiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: escalaconnect.settings
      DATABASE_ENGINE: postgres
      CSRF_TRUSTED_ORIGINS: http://localhost:8095,http://127.0.0.1:8095
      # Aponta o Celery para o serviço redis deste compose (sobrepõe o .env).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      # Cache compartilhado entre os workers (throttle de login da API do app).
      CACHE_URL: redis://redis:6379/2
      CELERY_TASK_EAGER_PROPAGATES: "True"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: escalaconnect-nginx
    restart: always
    ports:
      - "8095:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/static:ro
    depends_on:
      - web

  celeryworker:
    container_name: escalaconnect-celery
    build: .
    restart: always
    command: celery -A escalaconnect worker -l INFO
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: escalaconnect.settings
      DATABASE_ENGINE: postgres
      CSRF_TRUSTED_ORIGINS: http://localhost:8095,http://127.0.0.1:8095
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
      # Cache compartilhado entre os workers (throttle de login da API do app).
      CACHE_URL: redis://redis:6379/2
      CELERY_TASK_EAGER_PROPAGATES: "True"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    # O worker responde ao ping do Celery? `docker compose ps` mostra (healthy)/(unhealthy).
    # Só sinaliza: o Compose não reinicia container unhealthy. Quem avisa é o monitor da fila
    # (e-mail aos ADMINS e /healthz/celery; ver docs/monitoramento-celery.md).
    # $$HOSTNAME: o Compose entrega $HOSTNAME ao shell, que é o nome do nó (celery@<hostname>).
    healthcheck:
      test: ["CMD-SHELL", "celery -A escalaconnect inspect ping -d celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 1m

  # Celery Beat: dispara as tarefas periódicas (CELERY_BEAT_SCHEDULE em settings.py),
  # como o aviso pelo app 2h antes do evento. Deve existir UM só container deste
  # serviço: com dois, cada aviso sairia duplicado.
  celerybeat:
    container_name: escalaconnect-beat
    build: .
    restart: always
    command: celery -A escalaconnect beat -l INFO -s /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: escalaconnect.settings
      DATABASE_ENGINE: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      redis:
        condition: service_healthy
    # O beat regrava o arquivo de agenda depois de disparar uma tarefa; como o batimento sai a cada
    # 5 min, o beat vivo mantém o arquivo com até ~5 min. Parado ou travado, o arquivo envelhece.
    # Só sinaliza, como no worker.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -15 | grep -q ."]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m

  redis:
    image: redis:7-alpine
    container_name: escalaconnect-redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  static_volume:
